name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-secret-not-a-real-credential
      DATABASE_URL: "file:./ci.db"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + push schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Seed database (admin bootstrap sanity)
        run: npm run db:seed

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
